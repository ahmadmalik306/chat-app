type Room {
  id: String!
  name: String!
  participants: [User!]!
  type: RoomType
  updatedAt: String
  createdAt: String
}
input RoomInput {
  name: String!
  participants: [String!]!
}
enum RoomType {
  PRIVATE
  GROUP
}
type Query {
  getRoom(id: String!): Room
  getAllRoomsForUser(userId: String!): [Room]
}

type Mutation {
  createNewContact(input: RoomInput!): Room
  createNewGroup(input: RoomInput!): Room
}
